# Web estática de Órbita. La API de Python vive en Hugging Face Spaces (deploy/hf-space).
[build]
  base = "web"
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"
  # URL pública del Space; no es secreta. Se lee al construir (import.meta.env.PUBLIC_API_URL).
  # PUBLIC_API_URL = "https://<usuario>-orbita-api.hf.space"

[[headers]]
  for = "/media/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
