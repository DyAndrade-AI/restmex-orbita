server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Re-resuelve la API cada 10 s: en Railway su IP privada cambia en cada deploy.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
    set $api_backend ${API_UPSTREAM};

    location = /health {
        proxy_pass $api_backend/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location /api/ {
        proxy_pass $api_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    location ~* \.(?:css|js|woff2?|png|jpg|jpeg|webp|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
